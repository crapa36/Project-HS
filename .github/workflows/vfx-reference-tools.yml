name: VFX reference tools (synthetic only)

on:
  push:
    branches:
      - codex/vfx-reference-review-prep
    paths:
      - tools/vfx/**
      - .github/workflows/vfx-reference-tools.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: tools/vfx
      - name: Ensure media tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python3 --version
          ffmpeg -version
      - name: Test contracts and synthetic native-frame extraction
        run: python3 -m unittest discover -s tools/vfx -p 'test_*.py' -v
